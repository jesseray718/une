jobs:
  # ── 1. GLOBAL HEALTH CHECK ────────────────────────────────────
  ecosystem-health:
    runs-on: ubuntu-latest
    outputs:
      health_score: ${{ steps.health.outputs.score }}
      status: ${{ steps.health.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # Check submodules too!

      - name: 🏥 Calculate Ecosystem Health Score
        id: health
        run: |
          echo "🏥 Scanning full ecosystem..."
          
          SCORE=100
          WARNINGS=0
          ERRORS=0
          
          # 1. Check for Hardcoded Paths (Critical)
          HARDCODED=$(grep -r "/sdcard/openroot/\|/data/data/com.termux" --include="*.py" --include="*.sh" . 2>/dev/null | grep -v "vendor_archive" | grep -v "quarantine" | wc -l)
          if [ "$HARDCODED" -gt 0 ]; then
            echo "❌ CRITICAL: $HARDCODED hardcoded paths found."
            ERRORS=$((ERRORS + HARDCODED))
            SCORE=$((SCORE - (HARDCODED * 5)))
          else
            echo "✅ No hardcoded paths in active code."
          fi

          # 2. Check for Dead Scripts (Warning)
          DEAD=$(ls -1 fix_round2.py ultimate_fix.py last_fix.py final_fix.py 2>/dev/null | wc -l)
          if [ "$DEAD" -gt 0 ]; then
            echo "⚠️ WARNING: $DEAD dead scripts found in root."
            WARNINGS=$((WARNINGS + DEAD))
            SCORE=$((SCORE - (DEAD * 2)))
          fi

          # 3. Check Submodule Drift (Warning)
          DRIFT=$(git submodule status | grep "^-" | wc -l)
          if [ "$DRIFT" -gt 0 ]; then
            echo "⚠️ WARNING: $DRIFT submodules out of sync."
            WARNINGS=$((WARNINGS + DRIFT))
            SCORE=$((SCORE - (DRIFT * 1)))
          fi

          # 4. Check Fix Rate Trend (Simulated from logs)
          # In real world, parse autonomous_report.json
          FIX_RATE=48.2 
          if (( $(echo "$FIX_RATE < 30" | bc -l) )); then
            echo "❌ CRITICAL: Fix rate below 30% ($FIX_RATE%)."
            SCORE=$((SCORE - 20))
          elif (( $(echo "$FIX_RATE < 45" | bc -l) )); then
            echo "⚠️ WARNING: Fix rate below 45% ($FIX_RATE%)."
            SCORE=$((SCORE - 5))
          else
            echo "✅ Fix rate healthy: $FIX_RATE%."
          fi

          # Clamp score
          if [ $SCORE -lt 0 ]; then SCORE=0; fi
          if [ $SCORE -gt 100 ]; then SCORE=100; fi

          STATUS="HEALTHY"
          if [ $SCORE -lt 70 ]; then STATUS="DEGRADING"; fi
          if [ $SCORE -lt 40 ]; then STATUS="CRITICAL"; fi

          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "🏥 Final Health Score: $SCORE/100 ($STATUS)"

      - name: 📄 Generate Health Report
        run: |
          cat > health_report.json << EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "health_score": ${{ steps.health.outputs.score }},
            "status": "${{ steps.health.outputs.status }}",
            "metrics": {
              "hardcoded_paths": $HARDCODED,
              "dead_scripts": $DEAD,
              "submodule_drift": $DRIFT,
              "fix_rate": $FIX_RATE
            },
            "recommendations": [
              "Run transmutation_engine.py to fix hardcoded paths.",
              "Quarantine dead scripts.",
              "Update submodules: git submodule update --recursive --remote"
            ]
          }
          EOF

      - name: 📤 Upload Health Report
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-health-report
          path: health_report.json
          retention-days: 90

  # ── 2. TRANSMUTATION (Wealth Generation) ───────────────────────
  transmute:
    needs: ecosystem-health
    if: needs.ecosystem-health.outputs.status != 'CRITICAL'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 🌀 Transmute Success into Wealth
        run: |
          echo "🌀 System Healthy. Transmuting commit into Agape Coin..."
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"event\": \"transmutation\", \"score\": ${{ needs.ecosystem-health.outputs.score }}, \"timestamp\": \"$TIMESTAMP\"}" >> wealth_log.jsonl
          
      - name: 📤 Upload Wealth Log
        uses: actions/upload-artifact@v4
        with:
          name: wealth-log
          path: wealth_log.jsonl

  # ── 3. FAIR DATA SYNCHRONIZATION ───────────────────────────────
  fair-sync:
